<ion-buttons>
  <ion-button id="open-settings-modal" aria-label="Settings" title="Settings">
    <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
  </ion-button>
</ion-buttons>

<ion-modal #settingsModal trigger="open-settings-modal" aria-label="Settings">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Settings</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="settingsModal.dismiss()">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <p>App settings will appear here.</p>
    </ion-content>
  </ng-template>
</ion-modal>
