<button type="button" class="project-stats" [disabled]="!hasProject || loading"
  (click)="openHistory()" aria-haspopup="dialog" aria-label="Open stats history">
  @if (loading) {
    <span>Loading today's stats…</span>
  } @else if (!hasProject) {
    <span>Select a project to view today's stats.</span>
  } @else if (error) {
    <span>Today's stats are unavailable.</span>
  } @else if (summary) {
    <span>Today:</span>
    <span>
      <strong>{{ summary.completed }}</strong> completed
      ({{ summary.completedNew }} new / {{ summary.completedExisting }} existing)
    </span>
    <span><strong>{{ summary.remaining }}</strong> remaining</span>
    <span><strong>{{ summary.created }}</strong> created</span>
  } @else {
    <span>Loading today's stats…</span>
  }
</button>

<app-project-stats-history />
