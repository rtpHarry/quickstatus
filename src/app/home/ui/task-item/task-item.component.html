<ion-item
  lines="none"
  class="task-row"
  [class.private-row]="task.private === true"
  [class.section-heading-row]="task.sectionHeading === true"
>
  <span #moveHighlight class="move-highlight" aria-hidden="true"></span>
  <ion-grid>
    <ion-row class="ion-align-items-center">
      <ion-col size="auto">
        <div class="status-buttons" role="group" aria-label="Task status">
          <button
            type="button"
            [attr.aria-pressed]="task.status === '✅'"
            [disabled]="task.sectionHeading === true"
            (click)="selectStatus('✅')"
            title="Complete"
            aria-label="Complete"
          >✅</button>
          <button
            type="button"
            [attr.aria-pressed]="task.status === '☑️'"
            [disabled]="task.sectionHeading === true"
            (click)="selectStatus('☑️')"
            title="In-Progress"
            aria-label="In-Progress"
          >☑️</button>
          <button
            type="button"
            [attr.aria-pressed]="task.status === '❌'"
            [disabled]="task.sectionHeading === true"
            (click)="selectStatus('❌')"
            title="Incomplete"
            aria-label="Incomplete"
          >❌</button>
        </div>
      </ion-col>
      <ion-col class="task-text-column">
        @if (task.sectionHeading === true) {
          <ion-input
            class="section-heading-input"
            [ngModel]="task.text"
            (ngModelChange)="onTextChange($event)"
            (keydown)="handleKeydown($event)"
            placeholder="Enter heading"
            aria-label="Section heading"
            autocomplete="off"
            data-lpignore="true"
          ></ion-input>
        } @else {
          <app-task-text-editor
            [text]="task.text"
            (textChange)="onTextChange($event)"
            (editorKeydown)="handleKeydown($event)"
          ></app-task-text-editor>
        }
      </ion-col>
      <ion-col size="auto" class="task-actions">
        @if (ageBadge; as badge) {
          <span
            class="task-age-badge"
            [attr.title]="badge.label"
            [attr.aria-label]="badge.label"
          >{{ badge.text }}</span>
        }
        <ion-button
          fill="solid"
          (click)="toggleSectionHeading()"
          class="section-heading-button"
          [class.active]="task.sectionHeading === true"
          title="Toggle section heading"
          size="small"
        >
          <ion-icon name="text-outline"></ion-icon>
        </ion-button>
        <ion-button
          fill="solid"
          (click)="togglePrivate()"
          class="private-button"
          [class.active]="task.private === true"
          title="Toggle private (excludes from copy)"
          size="small"
        >
          <ion-icon
            [name]="task.private === true ? 'lock-closed-outline' : 'lock-open-outline'"
          ></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-item>
